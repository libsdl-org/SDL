name: 'Setup HarmonyOS toolchain'
description: 'Download HarmonyOS command line tools and setup CMake toolchain'
runs:
  using: 'composite'
  steps:
    - name: 'Calculate variables'
      id: calc
      shell: sh
      run: |
        version="6.1.1.280"
        case "${{ runner.os }}-${{ runner.arch }}" in
          "Linux-X64")
            archive="commandline-tools-linux-x64-${version}.zip"
            ;;
          "macOS-X86" | "macOS-X64")
            archive="commandline-tools-mac-x86-${version}.zip"
            ;;
          "macOS-ARM64")
            archive="commandline-tools-mac-arm64-${version}.zip"
            ;;
          "Windows-X64")
            archive="commandline-tools-windows-x64-${version}.zip"
            ;;
          *)
            echo "Unsupported ${{ runner.os }}-${{ runner.arch }}"
            exit 1;
            ;;
        esac
        echo "url=https://libsdl.org/harmonyos-devtools/${archive}" >> ${GITHUB_OUTPUT}
        echo "archive=${archive}" >> ${GITHUB_OUTPUT}
        echo "version=${version}" >> ${GITHUB_OUTPUT}
        echo "cache-key=${archive}-${{ runner.os }}-${{ runner.arch }}" >> ${GITHUB_OUTPUT}
    - name: 'Restore cached ${{ steps.calc.outputs.archive }}'
      id: cache-restore
      uses: actions/cache/restore@v5
      with:
        path: '${{ runner.temp }}/${{ steps.calc.outputs.archive }}'
        key: ${{ steps.calc.outputs.cache-key }}
    - name: 'Download HarmonyOS command line tools ${{ steps.calc.outputs.version }} for ${{ runner.os }} (${{ runner.arch }})'
      if: ${{ !steps.cache-restore.outputs.cache-hit || steps.cache-restore.outputs.cache-hit == 'false' }}
      shell: pwsh
      run: |
        Invoke-WebRequest "${{ steps.calc.outputs.url }}" -OutFile "${{ runner.temp }}/${{ steps.calc.outputs.archive }}"
    - name: 'Cache ${{ steps.calc.outputs.archive }}'
      if: ${{ !steps.cache-restore.outputs.cache-hit || steps.cache-restore.outputs.cache-hit == 'false' }}
      uses: actions/cache/save@v5
      with:
        path: '${{ runner.temp }}/${{ steps.calc.outputs.archive }}'
        key: ${{ steps.calc.outputs.cache-key }}
    - name: 'Extract HarmonyOS command line tools archive'
      shell: pwsh
      run: |
        unzip "${{ runner.temp }}/${{ steps.calc.outputs.archive }}" -d "${{ runner.temp }}"
    - name: 'Set output variables'
      id: final
      shell: pwsh
      run: |
        echo "${{ runner.temp }}/command-line-tools/sdk/default/openharmony/toolchains" >> $env:GITHUB_PATH
        echo "${{ runner.temp }}/command-line-tools/bin" >> $env:GITHUB_PATH


